<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winemint - report issue</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="icon" href="favicon.ico">
    <style>
        :root { --mint: #69b53f; --bg: #f8f9fa; --border: #ddd; }
        body { font-family: 'Ubuntu', sans-serif; background-color: var(--bg); color: #333; margin: 0; padding: 0; }
        header { background: white; padding: 20px; text-align: center; border-bottom: 3px solid var(--mint); }
        .logo { font-size: 32px; font-weight: bold; letter-spacing: -1px; }
        .logo a { text-decoration: none; color: #333; }
        .logo span { color: var(--mint); }
        
        .report-container { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        h1 { font-size: 26px; margin-top: 0; color: #222; text-align: center; }
        p { color: #666; font-size: 14px; text-align: center; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; font-size: 14px; color: #444; }
        label span { color: #999; font-weight: normal; font-size: 12px; }
        
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 6px; font-family: 'Ubuntu', sans-serif; font-size: 14px; box-sizing: border-box; transition: 0.2s; background: #fafafa; }
        input:focus, textarea:focus { border-color: var(--mint); background: white; outline: none; }
        textarea { resize: vertical; min-height: 150px; }
        
        .btn-submit { background: var(--mint); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background: #589934; }
        
        .back-link { display: block; text-align: center; margin-top: 25px; font-size: 14px; }
        .back-link a { color: #555; text-decoration: none; font-weight: bold; }
        .back-link a:hover { color: var(--mint); text-decoration: underline; }
        
        footer { text-align: center; padding: 40px; color: #999; font-size: 0.85em; }
    </style>
</head>
<body>

<header>
    <div class="logo"><a href="index.html">wine<span>mint</span></a></div>
</header>

<div class="report-container">
    <h1>Report an Issue / Feedback</h1>
    <form action="#" method="POST">
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name or nickname" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address <span>(optional)</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email if you want a reply">
        </div>
        
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Describe the issue, system edition (XFCE/KDE) or your hardware details..." required></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Submit Report</button>
    </form>
    
    <div class="back-link">
        <a href="winemint.github.io/download">← Back to Downloads</a>
    </div>
</div>


</body>
</html>
